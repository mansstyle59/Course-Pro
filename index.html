<style>
/* Layout : appli une colonne, barre d'onglets fixe en bas, contenu qui défile */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --fg:#17231c; --muted:#5f6d64; --line:#dde3dc;
  --accent:#1f6b47; --on-accent:#ffffff; --accent-soft:#e1efe6; --mustard:#e2a72e; --mustard-soft:#fbf0d6;
  --danger:#b8442c; --danger-soft:#f8e3dd; --ok:#2f8a57;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --fg:#e8eee9; --muted:#97a69c; --line:#2a3630;
  --accent:#5cc28d; --on-accent:#0f1512; --accent-soft:#1d3428; --mustard:#f0bf55; --mustard-soft:#3a3020;
  --danger:#ee8a72; --danger-soft:#3a221c; --ok:#5cc28d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --fg:#e8eee9; --muted:#97a69c; --line:#2a3630;
  --accent:#5cc28d; --on-accent:#0f1512; --accent-soft:#1d3428; --mustard:#f0bf55; --mustard-soft:#3a3020;
  --danger:#ee8a72; --danger-soft:#3a221c; --ok:#5cc28d; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 110px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:700}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
.note{font-size:.82rem;color:var(--muted)}

/* Accueil */
.hero{background:var(--accent);color:var(--on-accent);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .big{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1}
.hero-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--on-accent) 25%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mustard);border-radius:99px;transition:width .3s}
.bar i.over{background:var(--danger)}
.storecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.storecard .top{display:flex;gap:12px;align-items:flex-start}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.inp{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;font:inherit;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:1.5rem}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--accent);color:var(--on-accent);text-align:center;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.small{padding:9px 14px;font-size:.9rem;border-radius:11px}
.btn.warn{background:transparent;color:var(--danger);padding:8px 4px}
.btn:disabled{opacity:.45;cursor:default}

/* Pastilles d'état */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--ok)}
.pill.closed{background:var(--danger-soft);color:var(--danger)}
.pill.fmt{background:var(--mustard-soft);color:var(--fg)}
.pill.open::before,.pill.closed::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* Recherche */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;padding:14px 0}
.search input:focus{outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.sel{background:var(--accent-soft)}
.dot{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;color:#fff}
.thumb{flex:none;width:48px;height:48px;border-radius:13px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb svg{width:28px;height:28px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.thumb.sm{width:38px;height:38px;border-radius:11px}.thumb.sm svg{width:22px;height:22px}
/* Cartes produits visuelles, pensées pour le mobile */
.product-list{display:flex;flex-direction:column;gap:10px;background:transparent;border:0;overflow:visible}.product-list .product-row{border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:12px;gap:12px;align-items:center}.product-list .product-row:first-child{border-top:1px solid var(--line)}.product-row{gap:12px;align-items:center;padding:12px}.product-row .thumb{width:88px;height:88px;border-radius:18px;background:#fff;border:1px solid var(--line);color:var(--accent);flex:none}.product-row .thumb svg{width:48px;height:48px;opacity:.72}.product-row .thumb img{object-fit:contain;padding:5px;background:#fff}.product-row .txt{align-self:center}.product-row .txt .n{font-size:1rem;line-height:1.3;margin-bottom:4px}.product-row .product-category{font-size:.78rem;color:var(--muted);margin-bottom:5px}.product-row .product-price{font-weight:800;color:var(--accent);font-size:1.12rem;line-height:1.25}.product-row .product-price .approx{font-weight:500;color:var(--muted);font-size:.82rem}.product-row .star{width:30px}.product-row .icon-btn{width:46px;height:46px;border-radius:15px;font-size:1.2rem}@media(max-width:390px){.product-row{gap:8px;padding:10px}.product-row .thumb{width:70px;height:70px;border-radius:15px}.product-row .thumb svg{width:38px;height:38px}.product-row .icon-btn{width:40px;height:40px}.product-row .star{width:26px}}
.txt{flex:1;min-width:0}
.txt .n{font-weight:600;overflow-wrap:anywhere}
.txt .s{font-size:.85rem;color:var(--muted)}
.icon-btn{flex:none;width:38px;height:38px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.3rem;font-weight:700}
.icon-btn.in{background:var(--accent);color:var(--on-accent)}
.star{flex:none;border:0;background:none;width:34px;height:38px;color:var(--muted);opacity:.5;display:grid;place-items:center}
.star.on{color:var(--mustard);opacity:1}
.star svg{width:20px;height:20px}

/* Magasins */
.shop{display:flex;flex-direction:column;gap:8px;padding:14px;border-top:1px solid var(--line)}
.shop:first-child{border-top:0}
.shop .l1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.shop .km{font-family:var(--display);font-weight:700;white-space:nowrap}
.shop .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.shop .acts{display:flex;gap:8px;flex-wrap:wrap}
.shop.sel{background:var(--accent-soft)}

/* Panier */
.aisle{display:flex;flex-direction:column;gap:8px}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.row.done .n{text-decoration:line-through;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.qty span{min-width:22px;text-align:center;font-weight:700}
.pin{display:inline-flex;align-items:center;gap:2px;font-size:.85rem;color:var(--muted)}
.pin input{width:64px;border:1px dashed var(--line);background:transparent;color:var(--fg);border-radius:7px;padding:2px 5px;font:inherit;font-size:.85rem;text-align:right}
.pin input.edited{border-style:solid;border-color:var(--mustard)}
.totals{background:var(--mustard-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.totals div{display:flex;justify-content:space-between;gap:10px}
.totals .t{font-family:var(--display);font-size:1.35rem;font-weight:800}
.empty{text-align:center;padding:30px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:64px;height:64px;color:var(--accent)}
.add-row{display:flex;gap:8px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--danger);border-radius:14px;padding:12px}

/* Onglets */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--danger);color:var(--surface);border-radius:99px;font-size:.68rem;min-width:18px;padding:1px 5px;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* Horaires au format OpenStreetMap (« Mo-Sa 08:30-19:30; Su 09:00-12:30 ») */
function parseOH(str){
  if(!str)return null;str=str.trim();
  if(str==="24/7")return Array.from({length:7},()=>[[0,1440]]);
  const ORD=["Mo","Tu","We","Th","Fr","Sa","Su"],IDX={Su:0,Mo:1,Tu:2,We:3,Th:4,Fr:5,Sa:6};
  const h=[[],[],[],[],[],[],[]];
  for(let rule of str.split(";")){
    rule=rule.trim();if(!rule||/^PH\b/.test(rule))continue;
    let days,times;
    if(/^\d/.test(rule)){days=[0,1,2,3,4,5,6];times=rule}
    else{
      const m=rule.match(/^([A-Za-z,\- ]+?)\s+(\d.*|off|closed)$/);if(!m)return null;
      days=[];
      for(const part of m[1].replace(/\s/g,"").split(",")){
        if(part==="PH"||part==="")continue;
        const[a,b]=part.split("-");const ia=ORD.indexOf(a),ib=b?ORD.indexOf(b):ia;if(ia<0||ib<0)return null;
        for(let i=ia;;i=(i+1)%7){days.push(IDX[ORD[i]]);if(i===ib)break}
      }
      times=m[2];
    }
    let slots=[];
    if(!/^(off|closed)$/.test(times)){
      for(const t of times.split(",")){const x=t.trim().match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/);if(!x)return null;slots.push([+x[1]*60+ +x[2],+x[3]*60+ +x[4]])}
    }
    days.forEach(d=>h[d]=slots);
  }
  return h;
}

function status(s){
  if(!s.h)return null;
  const d=new Date(),day=d.getDay(),now=d.getHours()*60+d.getMinutes();
  const today=s.h[day]||[];
  for(const[o,c]of today){if(now>=o&&now<c)return{open:true,txt:`Ouvert · ferme à ${fmtT(c)}`}}
  const later=today.find(([o])=>o>now);
  if(later)return{open:false,txt:`Fermé · ouvre à ${fmtT(later[0])}`};
  for(let i=1;i<=7;i++){const dd=(day+i)%7,sl=s.h[dd];if(sl&&sl.length)return{open:false,txt:`Fermé · ouvre ${i===1?"demain":["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"][dd]} à ${fmtT(sl[0][0])}`}}
  return{open:false,txt:"Fermé"};
}

function imageQueryName(name){
  return name.replace(/\([^)]*\)/g," ").replace(/\b(x\d+|\d+(?:[,.]\d+)?\s?(?:g|kg|ml|cl|l)?)\b/gi," ").replace(/[–—]/g," ").replace(/\s+/g," ").trim();
}
function imageMatchScore(wanted,candidate){
  const clean=x=>imageQueryName(String(x||"")).toLocaleLowerCase("fr").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(t=>t.length>1);
  const stop=new Set(["produit","frais","fraiche","nature","original","france","format","kg","g","ml","cl","l","le","la","les","de","du"]);
  const synonyms={"pommes":"pomme","apples":"pomme","apple":"pomme","bananes":"banane","bananas":"banane","oranges":"orange","poires":"poire","tomates":"tomate","carottes":"carotte","fraises":"fraise","raisins":"raisin"};
  const norm=t=>synonyms[t]||t;
  const a=[...new Set(clean(wanted).filter(t=>!stop.has(t)).map(norm))],b=new Set(clean(candidate).filter(t=>!stop.has(t)).map(norm));
  if(!a.length||!b.size)return 0;
  const overlap=a.filter(t=>b.has(t)).length;
  return overlap/Math.max(1,a.length);
}
function bestProductImage(items,name){
  let best=null,score=0;
  for(const p of items||[]){
    const url=p.image_front_url||p.image_front_small_url||p.image_front_thumb_url||"";
    const title=p.product_name_fr||p.product_name||p.name||"";
    if(!url||!title)continue;
    const sc=imageMatchScore(name,title);
    if(sc>score){score=sc;best=url}
  }
  // Ne pas afficher une photo d'un produit sans rapport : seuil de correspondance strict.
  return score>=0.8?best:"";
}
async function pumpImages(){
  if(imgBusy||imgOff)return;imgBusy=true;
  while(imgQueue.length&&!imgOff){
    const name=imgQueue.shift();if(IMG[name]!==undefined)continue;
    try{
      const q=imageQueryName(name);
      let photo="";
      const plain=name.replace(/\([^)]*\)/g," ").replace(/\b(?:x\s?\d+|\d+(?:[,.]\d+)?\s?(?:g|kg|ml|cl|l))\b/gi," ").replace(/\s+/g," ").trim();
      const words=q.split(/\s+/).filter(w=>w.length>2);
      const queries=[name,q,plain,words.slice(0,4).join(" "),words.slice(-3).join(" ")].filter((x,i,a)=>x&&a.indexOf(x)===i);
      for(const query of queries){
        // Photos réelles de produits référencés par Open Food Facts. Aucun prix n’est déduit de la photo.
        try{
          const r=await getJSON(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(query)}&page_size=20&fields=product_name,product_name_fr,image_front_small_url,image_front_url,image_front_thumb_url&langs=fr`);
          photo=bestProductImage(r.hits||r.products||[],name);
        }catch(e){}
        if(photo)break;
        try{
          const r=await getJSON(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=20&fields=product_name,product_name_fr,image_front_small_url,image_front_url,image_front_thumb_url`);
          photo=bestProductImage(r.products||[],name);
        }catch(e){}
        if(photo)break;
        await new Promise(r=>setTimeout(r,180));
      }
      // Pour les fruits/légumes frais, compléter par une recherche d’images botaniques sur Wikimedia.
      // Le nom du fichier doit correspondre aux mots clés du produit avant d'accepter l'image.
      if(!photo&&catOf(name)==="fl"){
        try{
          const q2=(imageQueryName(name)+" fruit").trim();
          const w=await getJSON("https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent("filetype:bitmap "+q2)+"&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=400&format=json&origin=*");
          const pages=Object.values((w.query&&w.query.pages)||{});
          const terms=imageQueryName(name).toLocaleLowerCase("fr").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").split(/[^a-z0-9]+/).filter(t=>t.length>2);
          const match=pages.map(p=>({p,t:(p.title||"").toLocaleLowerCase("fr").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-z0-9]+/g," ")})).map(x=>({...x,score:terms.length?terms.filter(t=>x.t.includes(t)).length/terms.length:0})).sort((a,b)=>b.score-a.score)[0];
          if(match&&match.score>=0.5&&match.p.imageinfo&&match.p.imageinfo[0])photo=match.p.imageinfo[0].thumburl||match.p.imageinfo[0].url||"";
        }catch(e){}
      }
      // Une image n'est conservée que si son nom correspond suffisamment au produit.
      IMG[name]=photo||""; // mémorise aussi les absences pour éviter les requêtes répétées
      try{localStorage.setItem(IMGKEY,JSON.stringify(IMG))}catch(e){}
      document.querySelectorAll(`.thumb[data-img="${CSS.escape(name)}"]`).forEach(el=>{el.removeAttribute("data-img");if(IMG[name]){const im=new Image();im.alt=`Photo du produit ${name}`;im.onerror=()=>{im.remove();};im.src=IMG[name];el.appendChild(im)}});
    }catch(e){}
    await new Promise(r=>setTimeout(r,900));
  }
  imgBusy=false;
}

function openProductCamera(name){
  const input=document.createElement("input");
  input.type="file";input.accept="image/*";input.setAttribute("capture","environment");
  input.onchange=()=>{
    const file=input.files&&input.files[0];if(!file)return;
    if(file.size>8*1024*1024){toast("Photo trop lourde (maximum 8 Mo)");return}
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas"),max=1000,scale=Math.min(1,max/Math.max(img.width,img.height));
        canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        IMG[name]=canvas.toDataURL("image/jpeg",0.78);
        try{localStorage.setItem(IMGKEY,JSON.stringify(IMG));save();render();toast("Photo enregistrée pour "+name)}
        catch(e){delete IMG[name];toast("Stockage plein : photo non enregistrée")}
      };
      img.onerror=()=>toast("Impossible de lire cette photo");img.src=reader.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function vHistory(){

function vSearch(){
  const q=norm(S.q.trim());
  let rows="";
  if(q){
    const res=[];for(const k in CATS)CATS[k].items.forEach(i=>{if(norm(i[0]).includes(q)||norm(CATS[k].n).includes(q))res.push([i[0],k])});
    S.favs.filter(n=>catOf(n)==="au"&&norm(n).includes(q)).forEach(n=>res.push([n,"au"]));
    rows=res.slice(0,60).map(r=>productRow(r[0],r[1])).join("");
    if(!res.some(r=>norm(r[0])===q))rows+=`<div class="row">${thumb("","au")}<div class="txt"><div class="n">Ajouter « ${esc(S.q.trim())} »</div><div class="s">Produit absent du catalogue</div></div><button class="icon-btn" data-add="${esc(S.q.trim())}" data-cat="au" aria-label="Ajouter ce produit">+</button></div>`;
  }else{
    const keys=S.cat==="all"?Object.keys(CATS).filter(k=>CATS[k].items.length):[S.cat];
    rows=keys.map(k=>CATS[k].items.map(i=>productRow(i[0],k)).join("")).join("");
  }
  const n=Object.values(CATS).reduce((a,c)=>a+c.items.length,0);
  const chips=[["all","Tout"],...Object.keys(CATS).filter(k=>CATS[k].items.length).map(k=>[k,CATS[k].n])]
    .map(([k,n])=>`<button class="chip" data-cat-f="${k}" aria-pressed="${S.cat===k}">${n}</button>`).join("");
  return `<div class="view"><div class="head"><h1>Rechercher</h1><span class="note num">${n} produits</span></div>
  <label class="search">${ICON.search.replace("<svg",'<svg width="20" height="20"')}<input id="q" placeholder="Produit, marque ou rayon" value="${esc(S.q)}" autocomplete="off" aria-label="Rechercher un produit"></label>
  ${q?"":`<div class="chips">${chips}</div>`}
  <div class="list product-list">${rows}</div>
  <p class="note">Prix indicatifs relevés en France. Ils varient selon le magasin : corrigez-les dans le panier avec le prix vu en rayon, l'appli s'en souviendra.</p></div>`;
}

function storeLogo(name){
  const n=norm(name);
  if(n.includes('carrefour'))return 'https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/carrefour/default.svg';
  const domain=n.includes('leclerc')?'e.leclerc':n.includes('intermarche')?'intermarche.com':n.includes('lidl')?'lidl.fr':n.includes('aldi')?'aldi.fr':n.includes('auchan')?'auchan.fr':(['super u','hyper u','u express','utile'].includes(n)||n.includes('courses u'))?'coursesu.com':'';
  return domain?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(domain)+'&sz=128':'';
}
function cleanStoreName(s){
  const raw=String((s&&s.name)||'').trim().replace(/^[\s·•.,–—-]+|[\s·•.,–—-]+$/g,'');
  if(raw&&raw!=='.'&&raw!=='•'&&raw!=='-')return raw;
  const first=String((s&&s.addr)||'').split(',')[0].trim();
  return first&&!/^\d/.test(first)?first:'Magasin sans enseigne identifiée';
}

  ${!allDone&&nDone?`<p class="note">Les articles non cochés resteront dans le panier pour la prochaine fois.</p>`:""}

const quickAdd=()=>`<form class="add-row" id="quick"><input class="inp" id="quickname" placeholder="Ajout rapide (ex. : nutella)" autocomplete="off" aria-label="Ajout rapide"><button class="btn">Ajouter</button></form>`;

function render(){
  const v={home:vHome,search:vSearch,favs:vFavs,stores:vStores,cart:vCart}[S.tab];
  document.getElementById("app").innerHTML=v();
  const left=S.cart.filter(i=>!i.done).length;
  watchImages();
  if(productDetail){document.getElementById("app").insertAdjacentHTML("beforeend",productDetailView());watchImages()}
  document.getElementById("tabs").innerHTML=TABS.map(([k,l,ic])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${ICON[ic]}${l}${k==="cart"&&left?`<span class="badge num">${left}</span>`:""}</button>`).join("");
}

/* ---------- Interactions ---------- */
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&productDetail){productDetail=null;detailPriceDraft="";render()}});
document.addEventListener("click",e=>{
  if(e.target.closest(".detail-close")||(e.target.classList&&e.target.classList.contains("detail-backdrop"))){productDetail=null;detailPriceDraft="";render();return}
  const b=e.target.closest("button");
  if(!b){const row=e.target.closest("[data-product]");if(row){productDetail=row.dataset.product;detailQty=Math.max(1,inCart(productDetail)?.qty||1);const currentPrice=price(productDetail);detailPriceDraft=currentPrice?Number(currentPrice).toFixed(2):"";render()}return}
  const d=b.dataset;
  if("detailInc" in d){detailQty=Math.min(999,detailQty+1);render();return}
  if("detailDec" in d){detailQty=Math.max(1,detailQty-1);render();return}
  if("detailAdd" in d){
    const name=productDetail,raw=String(detailPriceDraft!==""?detailPriceDraft:(document.getElementById("detail-price")?.value||"")).replace(",",".");
    if(raw.trim()!==""&&Number.isFinite(Number(raw))){
      const val=Math.round(Number(raw)*100)/100;
      if(S.storeId){S.storePrices=S.storePrices||{};S.storePrices[S.storeId]=S.storePrices[S.storeId]||{};S.storePrices[S.storeId][name]=val}else S.prices[name]=val;
    }
    if(S.example){S.cart=[];S.example=false}
    let item=inCart(name);if(item){item.qty+=detailQty;item.done=false}else S.cart.push({id:uid(),name,cat:catOf(name),qty:detailQty,done:false});
    productDetail=null;detailPriceDraft="";save();render();toast(name+" ajouté au panier");return;
  }
  if(d.tab||d.go){S.tab=d.tab||d.go;S.confirmClear=false;render();window.scrollTo(0,0);return}
  if(d.add){addItem(d.add,d.cat);return}
  if(d.photo){openProductCamera(d.photo);return}
  if(d.fav){const i=S.favs.indexOf(d.fav);i<0?S.favs.push(d.fav):S.favs.splice(i,1);save();render();toast(i<0?"Ajouté aux favoris":"Retiré des favoris");return}
  if(d.catF){S.cat=d.catF;render();return}
  if(d.sf){S.storeFilter=d.sf;render();return}
  if(d.pick){pickStore(d.pick);return}
  if("searchstore" in d){searchStoreOnline();return}
   if("gps" in d){locateGPS();return}
  if(d.town){const t=TOWNS.find(t=>t[0]===d.town);setLoc({lat:t[2],lng:t[3],label:`${t[0]} (${t[1]})`,mode:"ville"});return}
  if(d.delstore){S.customStores=S.customStores.filter(s=>s.id!==d.delstore);if(S.storeId===d.delstore)S.storeId=null;save();render();return}
  if("allfavs" in d){if(S.example){S.cart=[];S.example=false}let n=0;S.favs.forEach(x=>{if(!inCart(x)){S.cart.push({id:uid(),name:x,cat:catOf(x),qty:1,done:false});n++}});save();render();toast(n?`${n} favori${n>1?"s":""} ajouté${n>1?"s":""}`:"Tous vos favoris sont déjà au panier");return}
  const it=id=>S.cart.find(i=>i.id===id);
  if(d.done){const i=it(d.done);i.done=!i.done;S.example=false;save();render();return}
  if(d.inc){it(d.inc).qty++;S.example=false;save();render();return}
  if(d.dec){const i=it(d.dec);if(--i.qty<1)S.cart=S.cart.filter(x=>x!==i);save();render();return}
  if("clear" in d){S.confirmClear=true;render();return}
  if("clearNo" in d){S.confirmClear=false;render();return}
  if("clearYes" in d){S.cart=[];S.example=false;S.confirmClear=false;save();render();toast("Panier vidé");return}
  if("finish" in d){
    const taken=S.cart.filter(i=>i.done);if(!taken.length)return;
    taken.forEach(i=>S.counts[i.name]=(S.counts[i.name]||0)+i.qty);
    S.history.push({date:Date.now(),store:storeLabel(store()),total:taken.reduce((a,i)=>a+line(i),0),count:taken.reduce((a,i)=>a+i.qty,0)});
    S.history=S.history.slice(-50);
    S.cart=S.cart.filter(i=>!i.done);S.example=false;save();S.tab="home";render();window.scrollTo(0,0);toast("Courses enregistrées");
  }
});
let searchRenderTimer=null;
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;clearTimeout(searchRenderTimer);const value=S.q;searchRenderTimer=setTimeout(()=>{if(S.q!==value)return;const q=document.getElementById("q");if(!q)return;const pos=q.selectionStart;render();const next=document.getElementById("q");if(next){next.focus({preventScroll:true});next.setSelectionRange(pos,pos)}},180)}
  if(e.target.id==="storesearch"){S.storeSearch=e.target.value;const pos=e.target.selectionStart;clearTimeout(storeSearchTimer);storeSearchTimer=setTimeout(()=>{const el=document.getElementById("storesearch");if(!el)return;render();const next=document.getElementById("storesearch");if(next){next.focus({preventScroll:true});next.setSelectionRange(pos,pos)}},120)}
  if(e.target.id==="detail-price"){detailPriceDraft=e.target.value}
  if(e.target.id==="budget"){const raw=String(e.target.value).replace(",",".");if(raw.trim()!==""&&Number.isFinite(Number(raw))){S.budget=Math.max(0,Math.round(Number(raw)*100)/100);save()}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="budget"){const raw=String(e.target.value).replace(",",".");S.budget=raw.trim()===""?0:Math.max(0,Math.round((Number(raw)||0)*100)/100);save();render();}
  if(e.target.dataset.price!=null){
    const n=e.target.dataset.price,v=parseFloat(String(e.target.value).replace(",","."));
    if(S.storeId){S.storePrices=S.storePrices||{};S.storePrices[S.storeId]=S.storePrices[S.storeId]||{};if(isNaN(v)||e.target.value===""){delete S.storePrices[S.storeId][n]}else S.storePrices[S.storeId][n]=Math.round(v*100)/100;}else{if(isNaN(v)||e.target.value===""){delete S.prices[n]}else S.prices[n]=Math.round(v*100)/100;}
    save();render();
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="quick"){
    const inp=document.getElementById("quickname"),n=inp.value.trim();if(!n)return;
    const all=Object.values(CATS).flatMap(c=>c.items).map(i=>i[0]);
    const m=all.find(x=>norm(x).startsWith(norm(n)))||all.find(x=>norm(x).includes(norm(n)));
    addItem(m||n.charAt(0).toUpperCase()+n.slice(1));
    setTimeout(()=>document.getElementById("quickname")?.focus());
  }
  if(e.target.id==="addstore"){
    const name=document.getElementById("sname").value.trim(),town=document.getElementById("stown").value.trim();if(!name)return;
    const s={id:"c-"+uid(),name,town,custom:true};S.customStores.push(s);pickStore(s.id);
  }
  if(e.target.id==="cityform")searchCity(document.getElementById("city").value);
});
try{render()}catch(err){console.error("Course Pro startup error:",err);const app=document.getElementById("app");if(app)app.innerHTML='<div style="padding:24px;font:16px -apple-system;color:#222"><h1>Course Pro</h1><p>Une erreur empêche le démarrage. Le détail a été enregistré pour diagnostic.</p><pre style="white-space:pre-wrap;color:#a11"></pre><button onclick="location.reload()" style="padding:12px 18px;border-radius:12px">Réessayer</button></div>';const pre=app?.querySelector("pre");if(pre)pre.textContent=String(err&&err.stack||err)} 
window.addEventListener("error",e=>{console.error("Course Pro error:",e.error||e.message)});
if(!S.liveStores&&S.loc.mode==="defaut")loadStoresAround().then(()=>{try{render()}catch(e){console.error(e)}});
setInterval(()=>{if(S.tab==="stores"||S.tab==="home"){const a=document.activeElement;if(!a||a.tagName!=="INPUT")render()}},60000);
</script>
